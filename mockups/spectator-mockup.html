/* ─── Reset & Base ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Courier New', 'Courier', monospace;
  color: var(--text);
  overflow: hidden;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ─── Phone Frame ─── */
.phone {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 812px;
  background: var(--bg-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 60px var(--btn-shadow);
}

/* ─── Scan Lines ─── */
.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    var(--scanline-color) 2px,
    var(--scanline-color) 4px
  );
}

/* ─── Vignette ─── */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
}

/* ─── Frequency Wave Decor ─── */
.freq-wave {
  position: absolute;
  bottom: 140px;
  left: 0;
  right: 0;
  height: 60px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.04;
  overflow: hidden;
}
.freq-wave::before {
  content: '';
  position: absolute;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    var(--freq-color) 0px,
    transparent 2px,
    transparent 8px,
    var(--freq-color) 10px,
    transparent 12px
  );
  animation: freqSweep 6s linear infinite;
}
@keyframes freqSweep {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ─── Signal Strength Bars ─── */
.signal-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  margin-left: 6px;
}
.signal-bars .bar {
  width: 4px;
  background: var(--signal-bar-1);
  border-radius: 1px 1px 0 0;
  animation: signalPulse 1.2s ease-in-out infinite alternate;
}
.signal-bars .bar:nth-child(1) { height: 6px;  animation-delay: 0.0s; }
.signal-bars .bar:nth-child(2) { height: 9px;  animation-delay: 0.15s; }
.signal-bars .bar:nth-child(3) { height: 13px; animation-delay: 0.3s; }
.signal-bars .bar:nth-child(4) { height: 16px; animation-delay: 0.45s; background: var(--signal-bar-4); }
.signal-bars .bar:nth-child(5) { height: 20px; animation-delay: 0.6s; background: var(--signal-bar-5); }
@keyframes signalPulse {
  0%   { opacity: 0.3; }
  100% { opacity: 1; }
}

/* ─── HEADER ─── */
.header {
  position: relative;
  z-index: 5;
  background: linear-gradient(180deg, var(--bg-header), var(--bg-header-to));
  border-bottom: 1px solid var(--accent-border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.header-icon {
  font-size: 18px;
  margin-right: 8px;
}
.header-title {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-shadow: 0 0 8px var(--header-shadow);
  flex: 1;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-enc {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-muted);
  border: 1px solid var(--accent-border-dim);
  padding: 2px 6px;
  border-radius: 2px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--status-dot);
  box-shadow: 0 0 6px var(--status-dot-glow);
  animation: blink 2s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* ─── Theme Switcher Dots ─── */
.theme-switcher {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
  padding: 3px 6px;
  background: rgba(0,0,0,0.4);
  border-radius: 20px;
  position: relative;
  z-index: 20;
}
.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: 0.2s;
  opacity: 0.6;
  flex-shrink: 0;
}
.theme-dot:hover {
  opacity: 1;
  transform: scale(1.2);
  border-color: rgba(255,255,255,0.5);
}
.theme-dot.active {
  opacity: 1;
  border-color: #fff;
  box-shadow: 0 0 8px currentColor;
}
.theme-dot-green {
  background: #00ff00;
  color: #00ff00;
}
.theme-dot-cyan {
  background: #00ffff;
  color: #00ffff;
}
.theme-dot-blue {
  background: #64b5f6;
  color: #64b5f6;
}

/* ─── Match Info Overlay ─── */
.match-info {
  position: relative;
  z-index: 5;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 8px 14px;
  background: var(--bg-tab);
  border-bottom: 1px solid var(--accent-border-light);
  flex-shrink: 0;
}
.match-info-item {
  text-align: center;
}
.match-info-item .info-val {
  font-size: 14px;
  font-weight: bold;
  color: var(--text-dim);
}
.match-info-item .info-label {
  font-size: 8px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}

/* ─── Map Area ─── */
.map-wrap {
  position: relative;
  flex: 1;
  min-height: 0;
  z-index: 5;
}
#map {
  width: 100%;
  height: 100%;
}
.leaflet-tile-pane {
  filter: brightness(0.4) invert(1) hue-rotate(var(--leaflet-hue)) saturate(0.6);
}

/* ─── Kill Feed ─── */
.kill-feed {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 500;
  display: flex;
  flex-direction: column;
  gap: 4px;
  max-width: 160px;
}
.kill-entry {
  background: rgba(10, 10, 10, 0.85);
  border: 1px solid var(--accent-border);
  border-left: 2px solid var(--accent);
  padding: 4px 8px;
  font-size: 9px;
  color: var(--text);
  border-radius: 2px;
  animation: killIn 0.3s ease-out;
}
@keyframes killIn {
  0% { opacity: 0; transform: translateX(10px); }
  100% { opacity: 1; transform: translateX(0); }
}
.kill-entry .killer { color: var(--accent-bright); font-weight: bold; }
.kill-entry .victim { color: var(--text-muted); }

/* ─── Player List ─── */
.player-list {
  flex-shrink: 0;
  max-height: 140px;
  overflow-y: auto;
  padding: 8px 14px;
  background: var(--bg-dark);
  border-top: 1px solid var(--accent-border);
  z-index: 5;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.player-list::-webkit-scrollbar { width: 4px; }
.player-list::-webkit-scrollbar-track { background: transparent; }
.player-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

.spec-player {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px solid var(--accent-border-light);
}
.spec-player:last-child { border-bottom: none; }
.spec-player .spec-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 4px var(--accent-glow);
  flex-shrink: 0;
}
.spec-player .spec-name {
  font-size: 11px;
  color: var(--text);
  flex: 1;
}
.spec-player .spec-stat {
  font-size: 9px;
  color: var(--text-muted);
  min-width: 50px;
  text-align: right;
}
.spec-player .spec-stat.val {
  color: var(--text-dim);
  font-weight: bold;
  min-width: 30px;
}

/* ─── Bottom Camera Bar ─── */
.camera-bar {
  flex-shrink: 0;
  padding: 10px 14px 14px;
  background: var(--bg-dark);
  border-top: 1px solid var(--accent-border);
  z-index: 5;
}
.camera-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
  text-align: center;
}
.camera-btns {
  display: flex;
  gap: 8px;
}
.cam-btn {
  flex: 1;
  font-family: 'Courier New', monospace;
  font-size: 10px;
  padding: 8px 6px;
  background: var(--bg-button);
  border: 1px solid var(--accent-border);
  border-radius: 4px;
  color: var(--accent-text);
  cursor: pointer;
  text-align: center;
  letter-spacing: 0.5px;
  transition: all 0.15s;
}
.cam-btn:hover {
  background: var(--bg-button-hover);
  border-color: var(--btn-border-hover);
}
.cam-btn.active {
  background: var(--bg-button-active);
  border-color: var(--accent);
  color: var(--accent-bright);
  box-shadow: 0 0 6px var(--btn-shadow);
}

/* ─── Responsive ─── */
@media (max-height: 640px) {
  .phone { max-height: 100vh; }
  .header { padding: 8px 12px; }
  .player-list { max-height: 100px; }
}
</style>
</head>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function() {
  const THEME_KEY = 'signal-lost-theme';

  function setTheme(themeName) {
    const phone = document.querySelector('.phone');
    phone.classList.remove('theme-cyan', 'theme-lightblue');
    if (themeName && themeName !== 'theme-green') {
      phone.classList.add(themeName);
    }
    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.classList.toggle('active', dot.dataset.theme === themeName);
    });
    localStorage.setItem(THEME_KEY, themeName);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) setTheme(saved);
  });

  document.addEventListener('click', function(e) {
    const dot = e.target.closest('.theme-dot');
    if (dot) setTheme(dot.dataset.theme);
  });

  // Leaflet map
  const map = L.map('map', { zoomControl: false, attributionControl: false }).setView([51.505, -0.09], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

  // Player positions
  const players = [
    { name: 'GHOST-1',  lat: 51.505, lng: -0.09,  color: '#00ff00' },
    { name: 'VIPER-3',  lat: 51.51,  lng: -0.08,  color: '#00ff00' },
    { name: 'WRAITH-2', lat: 51.50,  lng: -0.095, color: '#00ff00' },
    { name: 'SPECTRE-4',lat: 51.508, lng: -0.085, color: '#ffaa00' },
    { name: 'PHANTOM-5',lat: 51.502, lng: -0.088, color: '#ff4444' },
  ];

  players.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${p.color};border:2px solid #fff;box-shadow:0 0 8px ${p.color};"></div>`,
      iconSize: [14, 14]
    });
    L.marker([p.lat, p.lng], { icon: icon }).addTo(map).bindPopup(p.name, { className: 'obj-label' });
  });

  // Camera buttons
  document.querySelectorAll('.cam-btn').forEach(btn => {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.cam-btn').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // Timer countdown
  let minutes = 12, seconds = 47;
  setInterval(() => {
    seconds--;
    if (seconds < 0) { seconds = 59; minutes--; }
    if (minutes < 0) { minutes = 0; seconds = 0; }
    document.getElementById('timer').textContent =
      String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
  }, 1000);
})();
</script>
