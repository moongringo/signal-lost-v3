/* ── Reset & Base ────────────────────────────────────── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:'Courier New',Courier,monospace;
  font-size:14px;
  line-height:1.4;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ── Phone Frame ─────────────────────────────────────── */
.phone-frame{
  position:relative;
  width:100%;
  max-width:420px;
  height:100vh;
  max-height:812px;
  background:var(--bg-dark);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  box-shadow:0 0 60px var(--btn-shadow);
}

/* ── Scan Lines ──────────────────────────────────────── */
.scanlines{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:10;
  background:repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    var(--scanline-color) 2px,
    var(--scanline-color) 4px
  );
}

/* ── Vignette ────────────────────────────────────────── */
.vignette{
  position:absolute;
  inset:0;
  pointer-events:none;
  z-index:9;
  background:radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
}

/* ── Frequency Wave Decor ────────────────────────────── */
.freq-wave{
  position:absolute;
  bottom:140px;
  left:0;
  right:0;
  height:60px;
  z-index:1;
  pointer-events:none;
  opacity:0.04;
  overflow:hidden;
}
.freq-wave::before{
  content:'';
  position:absolute;
  width:200%;
  height:100%;
  background:repeating-linear-gradient(
    90deg,
    var(--freq-color) 0px,
    transparent 2px,
    transparent 8px,
    var(--freq-color) 10px,
    transparent 12px
  );
  animation:freqSweep 6s linear infinite;
}
@keyframes freqSweep{
  0%   { transform:translateX(0); }
  100% { transform:translateX(-50%); }
}

/* ── Theme Switcher ──────────────────────────────────── */
.theme-switcher{
  display:inline-flex;
  align-items:center;
  gap:6px;
  margin-right:8px;
  padding:3px 6px;
  background:rgba(0,0,0,0.4);
  border-radius:20px;
  position:relative;
  z-index:20;
}
.theme-dot{
  width:18px;
  height:18px;
  border-radius:50%;
  border:2px solid rgba(255,255,255,0.25);
  cursor:pointer;
  transition:0.2s;
  opacity:0.6;
  flex-shrink:0;
  background:transparent;
  padding:0;
}
.theme-dot:hover{
  opacity:1;
  transform:scale(1.2);
  border-color:rgba(255,255,255,0.5);
}
.theme-dot.active{
  opacity:1;
  border-color:#fff;
  box-shadow:0 0 8px currentColor;
}
.theme-dot-green{
  background:#00ff00;
  color:#00ff00;
}
.theme-dot-cyan{
  background:#00ffff;
  color:#00ffff;
}
.theme-dot-blue{
  background:#64b5f6;
  color:#64b5f6;
}

/* ── Signal Strength Bars (Header) ───────────────────── */
.signal-bars{
  display:inline-flex;
  align-items:flex-end;
  gap:2px;
  margin-left:6px;
}
.signal-bars .bar{
  width:4px;
  background:var(--signal-bar-1);
  border-radius:1px 1px 0 0;
  animation:signalPulse 1.2s ease-in-out infinite alternate;
}
.signal-bars .bar:nth-child(1){ height:6px;  animation-delay:0.0s; }
.signal-bars .bar:nth-child(2){ height:9px;  animation-delay:0.15s; }
.signal-bars .bar:nth-child(3){ height:13px; animation-delay:0.3s; }
.signal-bars .bar:nth-child(4){ height:16px; animation-delay:0.45s; background:var(--signal-bar-4); }
.signal-bars .bar:nth-child(5){ height:20px; animation-delay:0.6s; background:var(--signal-bar-5); }

@keyframes signalPulse{
  0%   { opacity:0.3; }
  100% { opacity:1; }
}

/* ── Status Dot ──────────────────────────────────────── */
.status-dot{
  width:6px;
  height:6px;
  border-radius:50%;
  background:var(--status-dot);
  box-shadow:0 0 6px var(--status-dot-glow);
  animation:blink 2s step-end infinite;
}
@keyframes blink{
  0%,100% { opacity:1; }
  50%     { opacity:0.2; }
}

/* ── Header ──────────────────────────────────────────── */
.header{
  position:relative;
  z-index:5;
  background:linear-gradient(180deg, var(--bg-header), var(--bg-header-to));
  border-bottom:1px solid var(--accent-border);
  padding:12px 16px;
  display:flex;
  align-items:center;
  flex-shrink:0;
}
.header .back-btn{
  display:flex;
  align-items:center;
  justify-content:center;
  width:44px;
  height:44px;
  background:transparent;
  border:1px solid var(--accent-border);
  border-radius:6px;
  color:var(--text);
  font-size:22px;
  cursor:pointer;
  flex-shrink:0;
  transition:border-color 0.15s,background 0.15s;
}
.header .back-btn:active{
  background:var(--bg-button);
  border-color:var(--accent);
}
.header-title{
  font-size:14px;
  font-weight:bold;
  letter-spacing:3px;
  color:var(--text-dim);
  text-shadow:0 0 8px var(--header-shadow);
  flex:1;
  text-transform:uppercase;
}
.header-right{
  display:flex;
  align-items:center;
  gap:6px;
}
.header-enc{
  font-size:9px;
  letter-spacing:1px;
  color:var(--text-muted);
  border:1px solid var(--accent-border-dim);
  padding:2px 6px;
  border-radius:2px;
}

/* ── Scrollable content ──────────────────────────────── */
.content{
  flex:1;
  overflow-y:auto;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:18px;
  position:relative;
  z-index:5;
  scrollbar-width:thin;
  scrollbar-color:var(--scrollbar-thumb) transparent;
}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--scrollbar-thumb);border-radius:2px}

/* ── Section headings ────────────────────────────────── */
.section-label{
  font-size:11px;
  letter-spacing:2px;
  text-transform:uppercase;
  color:var(--text-muted);
  margin-bottom:6px;
}

/* ── Map ──────────────────────────────────────────────── */
.map-section{width:100%}
#map{
  width:100%;
  height:300px;
  border:1px solid var(--accent-border);
  border-radius:6px;
  overflow:hidden;
}
.map-controls{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-top:8px;
  gap:8px;
}
.map-coords{
  font-size:12px;
  color:var(--text-dim);
  letter-spacing:1px;
}
.pin-btn{
  display:flex;
  align-items:center;
  gap:6px;
  padding:8px 16px;
  background:var(--bg-button);
  border:1px solid var(--accent-border);
  border-radius:6px;
  color:var(--accent-bright);
  font-family:inherit;
  font-size:13px;
  cursor:pointer;
  min-height:44px;
  transition:border-color 0.15s,background 0.15s,box-shadow 0.15s;
}
.pin-btn:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
  box-shadow:0 0 6px var(--btn-shadow-hover);
}
.pin-btn:active{
  background:var(--bg-button-active);
  border-color:var(--accent);
}

/* ── Map action buttons ────────────────────────── */
.map-actions{
  display:flex;
  gap:6px;
  margin-top:6px;
}
.map-action-btn{
  flex:1;
  padding:10px 8px;
  background:var(--bg-button);
  border:1px solid var(--accent-border);
  border-radius:6px;
  color:var(--accent-bright);
  font-family:inherit;
  font-size:11px;
  cursor:pointer;
  min-height:40px;
  letter-spacing:1px;
  text-transform:uppercase;
  transition:background 0.15s,border-color 0.15s,box-shadow 0.15s;
}
.map-action-btn:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
}
.map-action-btn:active{
  background:var(--bg-button-active);
}
.map-action-btn.saved{
  border-color:var(--accent);
  box-shadow:0 0 6px var(--btn-shadow);
}

/* ── Saved locations list ──────────────────────── */
.saved-location-item{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:8px 10px;
  margin-top:4px;
  background:var(--bg-button);
  border:1px solid var(--accent-border);
  border-radius:4px;
  font-size:11px;
  color:var(--text);
  cursor:pointer;
  transition:background 0.15s,border-color 0.15s;
}
.saved-location-item:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
}
.saved-location-item .loc-name{
  font-size:10px;
  color:var(--text-dim);
  letter-spacing:0.5px;
}
.saved-location-item .loc-coords{
  font-size:9px;
  color:var(--text-muted);
}
.saved-location-item .loc-default{
  font-size:9px;
  color:var(--accent);
  margin-left:4px;
}
.saved-location-item .loc-delete{
  width:24px;
  height:24px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:transparent;
  border:1px solid var(--accent-border-dim);
  border-radius:3px;
  color:var(--text-muted);
  cursor:pointer;
  font-size:10px;
  transition:background 0.15s,border-color 0.15s;
  flex-shrink:0;
}
.saved-location-item .loc-delete:hover{
  background:rgba(255,50,50,0.15);
  border-color:#ff4444;
  color:#ff4444;
}

/* ── Form groups ─────────────────────────────────────── */
.form-group{
  display:flex;
  flex-direction:column;
  gap:6px;
}

/* Text inputs */
.input-row{
  display:flex;
  gap:8px;
}
.input-row input{
  flex:1;
  min-width:0;
}
input[type="text"]{
  width:100%;
  padding:10px 12px;
  background:var(--bg-input-field);
  border:1px solid var(--accent-border);
  border-radius:4px;
  color:var(--text-input);
  font-family:inherit;
  font-size:14px;
  outline:none;
  transition:border-color 0.15s,box-shadow 0.15s;
  min-height:44px;
}
input[type="text"]:focus{
  border-color:var(--input-focus-border);
  box-shadow:inset 0 0 8px var(--input-focus-shadow);
}
input[type="text"]::placeholder{
  color:var(--text-placeholder);
}

/* ── Range slider ────────────────────────────────────── */
.range-wrap{
  display:flex;
  align-items:center;
  gap:12px;
}
.range-wrap input[type="range"]{
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:4px;
  background:var(--slider-track);
  border-radius:2px;
  outline:none;
}
.range-wrap input[type="range"]::-webkit-slider-thumb{
  -webkit-appearance:none;
  appearance:none;
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--bg);
  border:2px solid var(--accent);
  cursor:pointer;
  box-shadow:0 0 6px var(--accent-glow);
}
.range-wrap input[type="range"]::-moz-range-thumb{
  width:20px;
  height:20px;
  border-radius:50%;
  background:var(--bg);
  border:2px solid var(--accent);
  cursor:pointer;
}
.range-value{
  font-size:16px;
  font-weight:700;
  min-width:42px;
  text-align:center;
  color:var(--accent);
}

/* ── Player buttons ──────────────────────────────────── */
.player-row{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}
.player-btn{
  width:44px;
  height:44px;
  border:1px solid var(--accent-border);
  border-radius:6px;
  background:var(--bg-button);
  color:var(--text-muted);
  font-family:inherit;
  font-size:15px;
  cursor:pointer;
  transition:border-color 0.15s,color 0.15s,background 0.15s,box-shadow 0.15s;
}
.player-btn:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
}
.player-btn:active{
  background:var(--bg-button-active);
}
.player-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--bg-button-active);
  box-shadow:0 0 8px var(--btn-shadow);
}

/* ── Mission type cards ──────────────────────────────── */
.mission-row{
  display:flex;
  gap:6px;
  overflow-x:auto;
  padding-bottom:4px;
  -webkit-overflow-scrolling:touch;
}
.mission-row::-webkit-scrollbar{height:2px}
.mission-row::-webkit-scrollbar-track{background:transparent}
.mission-row::-webkit-scrollbar-thumb{background:var(--accent-border);border-radius:2px}
.mission-card{
  flex-shrink:0;
  width:88px;
  padding:10px 6px;
  border:1px solid var(--accent-border);
  border-radius:6px;
  background:var(--bg-button);
  color:var(--text-muted);
  font-family:inherit;
  font-size:10px;
  text-align:center;
  line-height:1.3;
  cursor:pointer;
  transition:border-color 0.15s,color 0.15s,background 0.15s,box-shadow 0.15s;
  min-height:44px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:3px;
}
.mission-card:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
}
.mission-card:active{
  background:var(--bg-button-active);
}
.mission-card .emoji{
  font-size:16px;
}
.mission-card.active{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--bg-button-active);
  box-shadow:0 0 10px var(--btn-shadow),inset 0 0 10px var(--btn-shadow);
}

/* ── Team mode buttons ───────────────────────────────── */
.team-row{
  display:flex;
  gap:8px;
}
.team-btn{
  flex:1;
  padding:12px 8px;
  border:1px solid var(--accent-border);
  border-radius:6px;
  background:var(--bg-button);
  color:var(--text-muted);
  font-family:inherit;
  font-size:12px;
  font-weight:700;
  text-align:center;
  cursor:pointer;
  min-height:52px;
  transition:border-color 0.15s,color 0.15s,background 0.15s,box-shadow 0.15s;
}
.team-btn:hover{
  background:var(--bg-button-hover);
  border-color:var(--btn-border-hover);
}
.team-btn:active{
  background:var(--bg-button-active);
}
.team-btn.active{
  border-color:var(--accent);
  color:var(--accent);
  background:var(--bg-button-active);
  box-shadow:0 0 8px var(--btn-shadow);
}
.team-btn .sub{
  display:block;
  font-size:10px;
  font-weight:400;
  opacity:0.6;
  margin-top:2px;
}

/* ── Team names (shown when competitive) ─────────────── */
.team-names{
  display:none;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
}
.team-names.visible{
  display:flex;
}

/* ── Confirm bar ─────────────────────────────────────── */
.confirm-bar{
  flex-shrink:0;
  padding:12px 14px 16px;
  border-top:1px solid var(--accent-border);
  position:relative;
  z-index:5;
}
.confirm-btn{
  width:100%;
  padding:15px;
  border:1px solid var(--accent);
  border-radius:8px;
  background:var(--bg-button);
  color:var(--accent-bright);
  font-family:inherit;
  font-size:15px;
  font-weight:700;
  letter-spacing:2px;
  text-transform:uppercase;
  cursor:pointer;
  min-height:52px;
  transition:background 0.15s,box-shadow 0.15s,border-color 0.15s;
  box-shadow:0 0 10px var(--btn-shadow),inset 0 0 8px var(--btn-shadow);
}
.confirm-btn:hover{
  background:var(--bg-button-hover);
  border-color:var(--accent-dim);
  box-shadow:0 0 16px var(--btn-shadow-hover),inset 0 0 12px var(--btn-shadow-hover);
}
.confirm-btn:active{
  background:var(--bg-button-active);
}

/* ── Leaflet dark overrides ──────────────────────────── */
.leaflet-container{background:var(--leaflet-bg) !important}
.leaflet-control-zoom a{background:var(--bg-input-field) !important;color:var(--text) !important;border-color:var(--accent-border) !important}
.leaflet-control-zoom{display:none}
.leaflet-control-attribution{background:rgba(0,0,0,0.7) !important;color:var(--leaflet-attrib) !important;font-size:9px !important}
.leaflet-control-attribution a{color:var(--leaflet-attrib-link) !important}

/* ── Responsive: ensure no scroll on body ────────────── */
@media (max-height:640px){
  .phone-frame{max-height:100vh}
  .header{padding:8px 12px}
  .content{padding:10px;gap:12px}
}
</style>
</head>
<body>

<div class="phone-frame" id="phoneFrame">

  <!-- Effects layers -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="freq-wave"></div>

  <!-- ═══ Header ═══ -->
  <div class="header">
    <button class="back-btn" aria-label="Back">←</button>
    <span class="header-title">Mission Setup</span>
    <div class="header-right">
      <div class="theme-switcher">
        <div class="theme-dot theme-dot-green active" data-theme="theme-green" title="Green (Default)"></div>
        <div class="theme-dot theme-dot-cyan" data-theme="theme-cyan" title="Cyan"></div>
        <div class="theme-dot theme-dot-blue" data-theme="theme-lightblue" title="Light Blue"></div>
      </div>
      <div class="signal-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="status-dot"></div>
      <span class="header-enc">AES-256</span>
    </div>
  </div>

  <!-- ═══ Scrollable Content ═══ -->
  <div class="content">

    <!-- ── Map Preview ── -->
    <div class="map-section">
      <div class="section-label">Drop Zone Preview</div>
      <div id="map"></div>
      <div class="map-controls">
        <span class="map-coords" id="coordsDisplay">40.7128°N, 74.0060°W</span>
        <button class="pin-btn" id="pinBtn">📍 PIN DROP</button>
      </div>
      <div class="map-actions">
        <button class="map-action-btn" id="saveLocationBtn">💾 Save Location</button>
        <button class="map-action-btn" id="setDefaultBtn">⭐ Set as Default</button>
      </div>
      <div class="saved-locations" id="savedLocations" style="display:none;">
        <div class="section-label" style="margin-top:8px;">Saved Locations</div>
        <div id="savedLocationsList"></div>
      </div>
    </div>

    <!-- ── Location ── -->
    <div class="form-group">
      <div class="section-label">Location</div>
      <div class="input-row">
        <input type="text" placeholder="Country" value="United States">
        <input type="text" placeholder="City" value="New York City">
      </div>
    </div>

    <!-- ── Duration ── -->
    <div class="form-group">
      <div class="section-label">Duration</div>
      <div class="range-wrap">
        <input type="range" id="durationSlider" min="15" max="90" value="30" step="1">
        <span class="range-value" id="durationDisplay">30 min</span>
      </div>
    </div>

    <!-- ── Players ── -->
    <div class="form-group">
      <div class="section-label">Players</div>
      <div class="player-row" id="playerRow">
        <button class="player-btn" data-value="1">1</button>
        <button class="player-btn active" data-value="2">2</button>
        <button class="player-btn" data-value="3">3</button>
        <button class="player-btn" data-value="4">4</button>
        <button class="player-btn" data-value="5">5</button>
        <button class="player-btn" data-value="6">6</button>
        <button class="player-btn" data-value="7">7</button>
        <button class="player-btn" data-value="8">8</button>
      </div>
    </div>

    <!-- ── Mission Type ── -->
    <div class="form-group">
      <div class="section-label">Mission Type</div>
      <div class="mission-row" id="missionRow">
        <button class="mission-card active" data-value="extraction">
          <span class="emoji">🛸</span> Extraction
        </button>
        <button class="mission-card" data-value="dataheist">
          <span class="emoji">💾</span> Data Heist
        </button>
        <button class="mission-card" data-value="sar">
          <span class="emoji">🔦</span> S&R
        </button>
        <button class="mission-card" data-value="scout">
          <span class="emoji">👁️</span> Scout Run
        </button>
        <button class="mission-card" data-value="nightop">
          <span class="emoji">🌙</span> Night Op
        </button>
        <button class="mission-card" data-value="freeroam">
          <span class="emoji">🗺️</span> Free Roam
        </button>
      </div>
    </div>

    <!-- ── Team Mode ── -->
    <div class="form-group">
      <div class="section-label">Team Mode</div>
      <div class="team-row" id="teamRow">
        <button class="team-btn active" data-mode="coop">
          CO-OP <span class="sub">(1 Team)</span>
        </button>
        <button class="team-btn" data-mode="competitive">
          COMPETITIVE <span class="sub">(2 Teams)</span>
        </button>
      </div>
      <div class="team-names" id="teamNames">
        <input type="text" placeholder="Team A name" value="Phoenix Squad">
        <input type="text" placeholder="Team B name" value="Shadow Ops">
      </div>
    </div>

  </div>

  <!-- ═══ Confirm Bar ═══ -->
  <div class="confirm-bar">
    <button class="confirm-btn">Confirm &amp; Continue →</button>
  </div>

</div>

<!-- ── Leaflet ── -->
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';

  // ── Map ──────────────────────────────────────────────
  const map = L.map('map', {
    center: [40.7128, -74.0060],
    zoom: 13,
    zoomControl: false,
    attributionControl: true
  });

  // Dark tile layer — CartoDB dark_all
  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
    subdomains: 'abcd',
    maxZoom: 20
  }).addTo(map);

  // Pin marker with drop animation
  const markerIcon = L.divIcon({
    className: 'custom-pin',
    html: '<span style="font-size:28px;line-height:1;">📍</span>',
    iconSize: [28, 28],
    iconAnchor: [14, 28],
    popupAnchor: [0, -30]
  });

  const marker = L.marker([40.7128, -74.0060], {
    icon: markerIcon,
    zIndexOffset: 1000
  }).addTo(map);

  // Drop animation — bounce the marker on load
  setTimeout(() => {
    const startLat = 40.80;
    const startLng = -74.00;
    const endLat = 40.7128;
    const endLng = -74.0060;
    const duration = 800;
    const startTime = performance.now();

    function animateDrop(now) {
      const elapsed = now - startTime;
      const t = Math.min(elapsed / duration, 1);
      // Ease-out cubic for bounce feel
      const ease = 1 - Math.pow(1 - t, 3);
      const lat = startLat + (endLat - startLat) * ease;
      const lng = startLng + (endLng - startLng) * ease;
      marker.setLatLng([lat, lng]);
      if (t < 1) requestAnimationFrame(animateDrop);
    }
    requestAnimationFrame(animateDrop);
  }, 200);

  // ── Coords update on map click ───────────────────────
  const coordsDisplay = document.getElementById('coordsDisplay');

  map.on('click', function(e){
    const lat = e.latlng.lat;
    const lng = e.latlng.lng;
    updateCoordsDisplay(lat, lng);
    marker.setLatLng(e.latlng);
  });

  // ── PIN DROP button ──────────────────────────────────
  document.getElementById('pinBtn').addEventListener('click', function(){
    const center = map.getCenter();
    const lat = center.lat;
    const lng = center.lng;
    updateCoordsDisplay(lat, lng);
    marker.setLatLng(center);
    // Bounce animation
    marker.setLatLng([center.lat + 0.02, center.lng]);
    const startTime = performance.now();
    const endLat = center.lat;
    const endLng = center.lng;
    function bounce(now){
      const elapsed = now - startTime;
      const t = Math.min(elapsed / 500, 1);
      const ease = 1 - Math.pow(1 - t, 3);
      const lat = center.lat + 0.02 + (endLat - center.lat - 0.02) * ease;
      const lng = center.lng + (endLng - center.lng) * ease;
      marker.setLatLng([lat, lng]);
      if (t < 1) requestAnimationFrame(bounce);
    }
    requestAnimationFrame(bounce);
  });

  // ── Duration slider ──────────────────────────────────
  const slider = document.getElementById('durationSlider');
  const display = document.getElementById('durationDisplay');
  slider.addEventListener('input', function(){
    display.textContent = this.value + ' min';
  });

  // ── Player buttons ───────────────────────────────────
  const playerBtns = document.querySelectorAll('#playerRow .player-btn');
  playerBtns.forEach(btn => {
    btn.addEventListener('click', function(){
      playerBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ── Mission cards ────────────────────────────────────
  const missionCards = document.querySelectorAll('#missionRow .mission-card');
  missionCards.forEach(card => {
    card.addEventListener('click', function(){
      missionCards.forEach(c => c.classList.remove('active'));
      this.classList.add('active');
    });
  });

  // ── Team mode ────────────────────────────────────────
  const teamBtns = document.querySelectorAll('#teamRow .team-btn');
  const teamNames = document.getElementById('teamNames');
  teamBtns.forEach(btn => {
    btn.addEventListener('click', function(){
      teamBtns.forEach(b => b.classList.remove('active'));
      this.classList.add('active');
      if (this.dataset.mode === 'competitive') {
        teamNames.classList.add('visible');
      } else {
        teamNames.classList.remove('visible');
      }
    });
  });

  // ── Save / Default Location ────────────────────────────
  let currentLat = 40.7128;
  let currentLng = -74.0060;
  let savedLocs = [];
  let defaultLocId = null;

  // Load from localStorage
  try {
    const saved = localStorage.getItem('signal-lost-saved-locations');
    if (saved) savedLocs = JSON.parse(saved);
    defaultLocId = localStorage.getItem('signal-lost-default-location') || null;
  } catch(e) {}

  function updateCoordsDisplay(lat, lng) {
    currentLat = lat;
    currentLng = lng;
    const latDir = lat >= 0 ? 'N' : 'S';
    const lngDir = lng >= 0 ? 'E' : 'W';
    coordsDisplay.textContent = `${Math.abs(lat).toFixed(4)}°${latDir}, ${Math.abs(lng).toFixed(4)}°${lngDir}`;
  }

  function renderSavedLocations() {
    const list = document.getElementById('savedLocationsList');
    const container = document.getElementById('savedLocations');
    if (savedLocs.length === 0) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'block';
    list.innerHTML = '';
    savedLocs.forEach(function(loc) {
      const item = document.createElement('div');
      item.className = 'saved-location-item';
      item.innerHTML =
        '<div>' +
          '<div class="loc-name">' + loc.name + ' <span class="loc-coords">' + loc.lat.toFixed(4) + ', ' + loc.lng.toFixed(4) + '</span>' +
          (loc.id === defaultLocId ? ' <span class="loc-default">★ DEFAULT</span>' : '') +
          '</div>' +
        '</div>' +
        '<button class="loc-delete" data-loc-id="' + loc.id + '">✕</button>';
      // Click to teleport
      item.addEventListener('click', function(e) {
        if (e.target.classList.contains('loc-delete')) return;
        marker.setLatLng([loc.lat, loc.lng]);
        map.setView([loc.lat, loc.lng], 13);
        updateCoordsDisplay(loc.lat, loc.lng);
      });
      // Delete button
      item.querySelector('.loc-delete').addEventListener('click', function(e) {
        e.stopPropagation();
        savedLocs = savedLocs.filter(function(l) { return l.id !== loc.id; });
        if (defaultLocId === loc.id) { defaultLocId = null; }
        try {
          localStorage.setItem('signal-lost-saved-locations', JSON.stringify(savedLocs));
          if (defaultLocId) localStorage.setItem('signal-lost-default-location', defaultLocId);
          else localStorage.removeItem('signal-lost-default-location');
        } catch(e) {}
        renderSavedLocations();
      });
      list.appendChild(item);
    });
  }

  // Save Location button
  document.getElementById('saveLocationBtn').addEventListener('click', function() {
    const name = prompt('Name this location:', 'LZ-' + (savedLocs.length + 1));
    if (!name) return;
    const newLoc = {
      id: Date.now().toString(),
      name: name,
      lat: currentLat,
      lng: currentLng
    };
    savedLocs.push(newLoc);
    try {
      localStorage.setItem('signal-lost-saved-locations', JSON.stringify(savedLocs));
    } catch(e) {}
    renderSavedLocations();
    this.textContent = '✅ Saved!';
    this.classList.add('saved');
    setTimeout(function() {
      document.getElementById('saveLocationBtn').textContent = '💾 Save Location';
      document.getElementById('saveLocationBtn').classList.remove('saved');
    }, 1500);
  });

  // Set as Default button
  document.getElementById('setDefaultBtn').addEventListener('click', function() {
    // Check if current location is already saved, offer to save first
    const existing = savedLocs.find(function(l) {
      return Math.abs(l.lat - currentLat) < 0.001 && Math.abs(l.lng - currentLng) < 0.001;
    });
    if (existing) {
      defaultLocId = existing.id;
    } else {
      // Auto-save as default
      const newLoc = {
        id: Date.now().toString(),
        name: 'Default LZ',
        lat: currentLat,
        lng: currentLng
      };
      savedLocs.push(newLoc);
      defaultLocId = newLoc.id;
      try {
        localStorage.setItem('signal-lost-saved-locations', JSON.stringify(savedLocs));
      } catch(e) {}
    }
    try {
      localStorage.setItem('signal-lost-default-location', defaultLocId);
    } catch(e) {}
    renderSavedLocations();
    this.textContent = '⭐ Default Set!';
    this.classList.add('saved');
    setTimeout(function() {
      document.getElementById('setDefaultBtn').textContent = '⭐ Set as Default';
      document.getElementById('setDefaultBtn').classList.remove('saved');
    }, 1500);
  });

  // Load default location on startup
  if (defaultLocId) {
    const defaultLoc = savedLocs.find(function(l) { return l.id === defaultLocId; });
    if (defaultLoc) {
      marker.setLatLng([defaultLoc.lat, defaultLoc.lng]);
      map.setView([defaultLoc.lat, defaultLoc.lng], 13);
      updateCoordsDisplay(defaultLoc.lat, defaultLoc.lng);
    }
  }

  renderSavedLocations();

  // ── Theme Switcher ───────────────────────────────────
  const phoneFrame = document.getElementById('phoneFrame');
  const themeDots = document.querySelectorAll('.theme-dot');
  const themes = ['green', 'cyan', 'lightblue'];

  function applyTheme(theme) {
    // Remove all theme classes
    themes.forEach(t => phoneFrame.classList.remove('theme-' + t));
    // Add the chosen one
    phoneFrame.classList.add('theme-' + theme);
    // Update active dot
    themeDots.forEach(dot => {
      dot.classList.toggle('active', dot.dataset.theme === 'theme-' + theme);
    });
    // Save to localStorage
    try {
      localStorage.setItem('signal-lost-theme', theme);
    } catch(e) {}
  }

  // Load saved theme or default to green
  let savedTheme = 'green';
  try {
    savedTheme = localStorage.getItem('signal-lost-theme') || 'green';
  } catch(e) {}
  // Ensure valid theme
  if (!themes.includes(savedTheme)) savedTheme = 'green';
  applyTheme(savedTheme);

  // Click handlers
  themeDots.forEach(dot => {
    dot.addEventListener('click', function() {
      applyTheme(this.dataset.theme.replace('theme-', ''));
    });
  });

  // Invalidate map size after render
  setTimeout(() => map.invalidateSize(), 100);
})();
</script>
