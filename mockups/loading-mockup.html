/* ─── Reset & Base ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Courier New', 'Courier', monospace;
  color: var(--text);
  overflow: hidden;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ─── Phone Frame ─── */
.phone {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 812px;
  background: var(--bg-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 60px var(--btn-shadow);
}

/* ─── Scan Lines ─── */
.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    var(--scanline-color) 2px,
    var(--scanline-color) 4px
  );
}

/* ─── Vignette ─── */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
}

/* ─── Frequency Wave Decor ─── */
.freq-wave {
  position: absolute;
  bottom: 140px;
  left: 0;
  right: 0;
  height: 60px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.04;
  overflow: hidden;
}
.freq-wave::before {
  content: '';
  position: absolute;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    var(--freq-color) 0px,
    transparent 2px,
    transparent 8px,
    var(--freq-color) 10px,
    transparent 12px
  );
  animation: freqSweep 6s linear infinite;
}
@keyframes freqSweep {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ─── Signal Strength Bars ─── */
.signal-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  margin-left: 6px;
}
.signal-bars .bar {
  width: 4px;
  background: var(--signal-bar-1);
  border-radius: 1px 1px 0 0;
  animation: signalPulse 1.2s ease-in-out infinite alternate;
}
.signal-bars .bar:nth-child(1) { height: 6px;  animation-delay: 0.0s; }
.signal-bars .bar:nth-child(2) { height: 9px;  animation-delay: 0.15s; }
.signal-bars .bar:nth-child(3) { height: 13px; animation-delay: 0.3s; }
.signal-bars .bar:nth-child(4) { height: 16px; animation-delay: 0.45s; background: var(--signal-bar-4); }
.signal-bars .bar:nth-child(5) { height: 20px; animation-delay: 0.6s; background: var(--signal-bar-5); }
@keyframes signalPulse {
  0%   { opacity: 0.3; }
  100% { opacity: 1; }
}

/* ─── HEADER ─── */
.header {
  position: relative;
  z-index: 5;
  background: linear-gradient(180deg, var(--bg-header), var(--bg-header-to));
  border-bottom: 1px solid var(--accent-border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.header-icon {
  font-size: 18px;
  margin-right: 8px;
}
.header-title {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-shadow: 0 0 8px var(--header-shadow);
  flex: 1;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-enc {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-muted);
  border: 1px solid var(--accent-border-dim);
  padding: 2px 6px;
  border-radius: 2px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--status-dot);
  box-shadow: 0 0 6px var(--status-dot-glow);
  animation: blink 2s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* ─── Theme Switcher Dots ─── */
.theme-switcher {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
  padding: 3px 6px;
  background: rgba(0,0,0,0.4);
  border-radius: 20px;
  position: relative;
  z-index: 20;
}
.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: 0.2s;
  opacity: 0.6;
  flex-shrink: 0;
}
.theme-dot:hover {
  opacity: 1;
  transform: scale(1.2);
  border-color: rgba(255,255,255,0.5);
}
.theme-dot.active {
  opacity: 1;
  border-color: #fff;
  box-shadow: 0 0 8px currentColor;
}
.theme-dot-green {
  background: #00ff00;
  color: #00ff00;
}
.theme-dot-cyan {
  background: #00ffff;
  color: #00ffff;
}
.theme-dot-blue {
  background: #64b5f6;
  color: #64b5f6;
}

/* ─── Boot Content ─── */
.boot-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  position: relative;
  z-index: 5;
  gap: 20px;
}

/* ─── SIGNAL LOST Title ─── */
.boot-title {
  font-size: 32px;
  font-weight: bold;
  letter-spacing: 8px;
  color: var(--accent);
  text-shadow: 0 0 20px var(--accent-glow), 0 0 40px rgba(var(--accent-rgb), 0.3);
  text-align: center;
  animation: titlePulse 2s ease-in-out infinite alternate;
}
@keyframes titlePulse {
  0%   { opacity: 0.85; text-shadow: 0 0 16px var(--accent-glow), 0 0 32px rgba(var(--accent-rgb), 0.2); }
  100% { opacity: 1; text-shadow: 0 0 24px var(--accent-glow), 0 0 48px rgba(var(--accent-rgb), 0.4); }
}

/* ─── Satellite Scanner ─── */
.scanner-wrap {
  position: relative;
  width: 120px;
  height: 120px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.scanner-ring {
  position: absolute;
  border: 2px solid var(--accent-border);
  border-radius: 50%;
}
.scanner-ring:nth-child(1) { width: 40px; height: 40px; }
.scanner-ring:nth-child(2) { width: 70px; height: 70px; }
.scanner-ring:nth-child(3) { width: 100px; height: 100px; }
.scanner-sweep {
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--accent);
  animation: scannerRotate 1.5s linear infinite;
}
.scanner-sweep::after {
  content: '';
  position: absolute;
  inset: -2px;
  border-radius: 50%;
  border: 2px solid transparent;
  border-top-color: var(--accent-glow);
  opacity: 0.5;
  animation: scannerRotate 1.5s linear infinite reverse;
}
@keyframes scannerRotate {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}
.scanner-icon {
  font-size: 28px;
  z-index: 2;
  animation: iconPulse 1.2s ease-in-out infinite alternate;
}
@keyframes iconPulse {
  0%   { opacity: 0.6; transform: scale(0.95); }
  100% { opacity: 1; transform: scale(1.05); }
}

/* ─── Boot Terminal ─── */
.terminal {
  width: 100%;
  max-width: 340px;
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  border-radius: 4px;
  padding: 12px 14px;
  font-size: 11px;
  line-height: 1.7;
  color: var(--text-system);
  min-height: 160px;
  position: relative;
}
.terminal-line {
  display: flex;
  gap: 8px;
  opacity: 0;
  animation: lineIn 0.2s ease-out forwards;
}
.terminal-line .prompt {
  color: var(--accent-muted);
  flex-shrink: 0;
}
.terminal-line .ok {
  color: var(--accent);
}
.terminal-line .warn {
  color: #ffaa00;
}
.terminal-line .fail {
  color: #ff4444;
}
@keyframes lineIn {
  0%   { opacity: 0; transform: translateX(-4px); }
  100% { opacity: 1; transform: translateX(0); }
}

/* ─── Typing Cursor ─── */
.typing-cursor {
  display: inline-block;
  width: 7px;
  height: 12px;
  background: var(--accent);
  animation: cursorBlink 0.8s step-end infinite;
  vertical-align: middle;
  margin-left: 2px;
}
@keyframes cursorBlink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0; }
}

/* ─── Progress Bar ─── */
.progress-wrap {
  width: 100%;
  max-width: 340px;
}
.progress-label {
  display: flex;
  justify-content: space-between;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--text-muted);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.progress-track {
  width: 100%;
  height: 6px;
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  border-radius: 3px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  width: 0%;
  background: linear-gradient(90deg, var(--accent-dim), var(--accent));
  border-radius: 2px;
  transition: width 0.3s ease;
  box-shadow: 0 0 8px rgba(var(--accent-rgb), 0.3);
}

/* ─── Bottom Status ─── */
.boot-status {
  position: absolute;
  bottom: 16px;
  left: 0;
  right: 0;
  text-align: center;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--text-muted);
  text-transform: uppercase;
  z-index: 5;
}
.boot-status.connected {
  color: var(--accent);
  text-shadow: 0 0 8px var(--accent-glow);
  animation: statusGlow 1.5s ease-in-out infinite alternate;
}
@keyframes statusGlow {
  0%   { opacity: 0.7; }
  100% { opacity: 1; }
}

/* ─── Responsive ─── */
@media (max-height: 640px) {
  .phone { max-height: 100vh; }
  .header { padding: 8px 12px; }
  .boot-content { padding: 14px; gap: 14px; }
  .boot-title { font-size: 24px; letter-spacing: 5px; }
  .scanner-wrap { width: 90px; height: 90px; }
  .scanner-sweep { width: 90px; height: 90px; }
  .scanner-ring:nth-child(1) { width: 30px; height: 30px; }
  .scanner-ring:nth-child(2) { width: 55px; height: 55px; }
  .scanner-ring:nth-child(3) { width: 80px; height: 80px; }
  .terminal { min-height: 120px; font-size: 10px; }
}
</style>
</head>
<body>

<div class="phone">

  <!-- Effects layers -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="freq-wave"></div>

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <span class="header-icon">📡</span>
    <span class="header-title">BOOT SEQUENCE</span>
    <div class="header-right">
      <div class="theme-switcher">
        <div class="theme-dot theme-dot-green active" data-theme="theme-green" title="Green (Default)"></div>
        <div class="theme-dot theme-dot-cyan" data-theme="theme-cyan" title="Cyan"></div>
        <div class="theme-dot theme-dot-blue" data-theme="theme-lightblue" title="Light Blue"></div>
      </div>
      <div class="signal-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="status-dot"></div>
      <span class="header-enc">AES-256</span>
    </div>
  </div>

  <!-- ═══ BOOT CONTENT ═══ -->
  <div class="boot-content">

    <!-- Title -->
    <div class="boot-title" id="bootTitle">SIGNAL LOST</div>

    <!-- Satellite Scanner -->
    <div class="scanner-wrap">
      <div class="scanner-ring"></div>
      <div class="scanner-ring"></div>
      <div class="scanner-ring"></div>
      <div class="scanner-sweep"></div>
      <div class="scanner-icon">🛰️</div>
    </div>

    <!-- Terminal Boot Log -->
    <div class="terminal" id="terminal">
      <div class="terminal-line" style="animation-delay:0.0s"><span class="prompt">&gt;</span><span>System init...</span></div>
    </div>

    <!-- Progress Bar -->
    <div class="progress-wrap">
      <div class="progress-label">
        <span>Loading</span>
        <span id="progressPercent">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

  </div>

  <!-- ═══ BOTTOM STATUS ═══ -->
  <div class="boot-status" id="bootStatus">Establishing uplink...</div>

</div>

<script>
(function() {
  const THEME_KEY = 'signal-lost-theme';

  function setTheme(themeName) {
    const phone = document.querySelector('.phone');
    phone.classList.remove('theme-cyan', 'theme-lightblue');
    if (themeName && themeName !== 'theme-green') {
      phone.classList.add(themeName);
    }
    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.classList.toggle('active', dot.dataset.theme === themeName);
    });
    localStorage.setItem(THEME_KEY, themeName);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) setTheme(saved);
  });

  document.addEventListener('click', function(e) {
    const dot = e.target.closest('.theme-dot');
    if (dot) setTheme(dot.dataset.theme);
  });

  // Boot sequence simulation
  const bootLines = [
    { text: 'Initializing comms...', status: 'ok', delay: 400 },
    { text: 'Scanning satellites...', status: 'ok', delay: 700 },
    { text: 'Handshake with SATCOM-7...', status: 'ok', delay: 1000 },
    { text: 'Downloading mission params...', status: 'ok', delay: 1300 },
    { text: 'Verifying squad roster...', status: 'ok', delay: 1600 },
    { text: 'Encrypting channel (AES-256)...', status: 'ok', delay: 1900 },
    { text: 'Calibrating GPS offset...', status: 'ok', delay: 2200 },
    { text: 'Loading tactical overlay...', status: 'ok', delay: 2500 },
    { text: 'Spooling drone telemetry...', status: 'warn', delay: 2800 },
    { text: 'All systems nominal.', status: 'ok', delay: 3200 },
  ];

  const terminal = document.getElementById('terminal');
  const progressFill = document.getElementById('progressFill');
  const progressPercent = document.getElementById('progressPercent');
  const bootStatus = document.getElementById('bootStatus');

  let progress = 0;
  const targetProgress = 100;
  const progressInterval = setInterval(() => {
    if (progress < targetProgress) {
      progress += Math.random() * 4 + 1;
      if (progress > targetProgress) progress = targetProgress;
      progressFill.style.width = progress + '%';
      progressPercent.textContent = Math.floor(progress) + '%';
    }
    if (progress >= targetProgress) {
      clearInterval(progressInterval);
      bootStatus.textContent = 'CONNECTED';
      bootStatus.classList.add('connected');
    }
  }, 80);

  bootLines.forEach((line, index) => {
    setTimeout(() => {
      const div = document.createElement('div');
      div.className = 'terminal-line';
      div.style.animationDelay = '0s';
      const statusClass = line.status === 'ok' ? 'ok' : line.status === 'warn' ? 'warn' : 'fail';
      const statusText = line.status === 'ok' ? ' OK' : line.status === 'warn' ? ' WARN' : ' FAIL';
      div.innerHTML = '<span class="prompt">&gt;</span><span>' + line.text + ' <span class="' + statusClass + '">' + statusText + '</span></span>';
      terminal.appendChild(div);
      terminal.scrollTop = terminal.scrollHeight;
    }, line.delay);
  });
})();
</script>
</body>
</html>
