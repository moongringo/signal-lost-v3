/* ─── Reset & Base ─── */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'Courier New', 'Courier', monospace;
  color: var(--text);
  overflow: hidden;
}
body {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* ─── Phone Frame ─── */
.phone {
  width: 100%;
  max-width: 420px;
  height: 100vh;
  max-height: 812px;
  background: var(--bg-dark);
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 60px var(--btn-shadow);
}

/* ─── Scan Lines ─── */
.scanlines {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: repeating-linear-gradient(
    0deg,
    transparent 0px,
    transparent 2px,
    var(--scanline-color) 2px,
    var(--scanline-color) 4px
  );
}

/* ─── Vignette ─── */
.vignette {
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 9;
  background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.7) 100%);
}

/* ─── Frequency Wave Decor ─── */
.freq-wave {
  position: absolute;
  bottom: 140px;
  left: 0;
  right: 0;
  height: 60px;
  z-index: 1;
  pointer-events: none;
  opacity: 0.04;
  overflow: hidden;
}
.freq-wave::before {
  content: '';
  position: absolute;
  width: 200%;
  height: 100%;
  background: repeating-linear-gradient(
    90deg,
    var(--freq-color) 0px,
    transparent 2px,
    transparent 8px,
    var(--freq-color) 10px,
    transparent 12px
  );
  animation: freqSweep 6s linear infinite;
}
@keyframes freqSweep {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ─── Signal Strength Bars ─── */
.signal-bars {
  display: inline-flex;
  align-items: flex-end;
  gap: 2px;
  margin-left: 6px;
}
.signal-bars .bar {
  width: 4px;
  background: var(--signal-bar-1);
  border-radius: 1px 1px 0 0;
  animation: signalPulse 1.2s ease-in-out infinite alternate;
}
.signal-bars .bar:nth-child(1) { height: 6px;  animation-delay: 0.0s; }
.signal-bars .bar:nth-child(2) { height: 9px;  animation-delay: 0.15s; }
.signal-bars .bar:nth-child(3) { height: 13px; animation-delay: 0.3s; }
.signal-bars .bar:nth-child(4) { height: 16px; animation-delay: 0.45s; background: var(--signal-bar-4); }
.signal-bars .bar:nth-child(5) { height: 20px; animation-delay: 0.6s; background: var(--signal-bar-5); }
@keyframes signalPulse {
  0%   { opacity: 0.3; }
  100% { opacity: 1; }
}

/* ─── HEADER ─── */
.header {
  position: relative;
  z-index: 5;
  background: linear-gradient(180deg, var(--bg-header), var(--bg-header-to));
  border-bottom: 1px solid var(--accent-border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  flex-shrink: 0;
}
.header-icon {
  font-size: 18px;
  margin-right: 8px;
}
.header-title {
  font-size: 14px;
  font-weight: bold;
  letter-spacing: 3px;
  color: var(--text-dim);
  text-shadow: 0 0 8px var(--header-shadow);
  flex: 1;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 6px;
}
.header-enc {
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-muted);
  border: 1px solid var(--accent-border-dim);
  padding: 2px 6px;
  border-radius: 2px;
}
.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--status-dot);
  box-shadow: 0 0 6px var(--status-dot-glow);
  animation: blink 2s step-end infinite;
}
@keyframes blink {
  0%, 100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

/* ─── Theme Switcher Dots ─── */
.theme-switcher {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-right: 8px;
  padding: 3px 6px;
  background: rgba(0,0,0,0.4);
  border-radius: 20px;
  position: relative;
  z-index: 20;
}
.theme-dot {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  border: 2px solid rgba(255,255,255,0.25);
  cursor: pointer;
  transition: 0.2s;
  opacity: 0.6;
  flex-shrink: 0;
}
.theme-dot:hover {
  opacity: 1;
  transform: scale(1.2);
  border-color: rgba(255,255,255,0.5);
}
.theme-dot.active {
  opacity: 1;
  border-color: #fff;
  box-shadow: 0 0 8px currentColor;
}
.theme-dot-green {
  background: #00ff00;
  color: #00ff00;
}
.theme-dot-cyan {
  background: #00ffff;
  color: #00ffff;
}
.theme-dot-blue {
  background: #64b5f6;
  color: #64b5f6;
}

/* ─── Content Scroll Area ─── */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 14px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
  z-index: 5;
  scrollbar-width: thin;
  scrollbar-color: var(--scrollbar-thumb) transparent;
}
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-track { background: transparent; }
.content::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 2px; }

/* ─── Section Label ─── */
.section-label {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 6px;
}

/* ─── Game Code Display ─── */
.code-display {
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  padding: 18px 12px;
  text-align: center;
  margin-bottom: 4px;
}
.code-display .code-label {
  font-size: 9px;
  letter-spacing: 2px;
  color: var(--text-muted);
  text-transform: uppercase;
  margin-bottom: 8px;
}
.code-display .code-value {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 6px;
  color: var(--accent-bright);
  text-shadow: 0 0 12px var(--btn-shadow-hover);
  font-family: 'Courier New', monospace;
}
.code-display .code-sub {
  font-size: 10px;
  color: var(--text-system);
  margin-top: 6px;
}

/* ─── Buttons ─── */
.btn {
  font-family: 'Courier New', monospace;
  font-size: 12px;
  padding: 12px 16px;
  background: var(--bg-button);
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  color: var(--accent-bright);
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  transition: all 0.15s;
  min-height: 44px;
  text-align: center;
}
.btn:hover {
  background: var(--bg-button-hover);
  border-color: var(--btn-border-hover);
  box-shadow: 0 0 8px var(--btn-shadow-hover);
}
.btn:active {
  background: var(--bg-button-active);
  transform: scale(0.97);
}
.btn-primary {
  border-color: var(--accent);
  box-shadow: 0 0 10px var(--btn-shadow), inset 0 0 8px var(--btn-shadow);
}
.btn-primary:hover {
  border-color: var(--accent-dim);
  box-shadow: 0 0 16px var(--btn-shadow-hover), inset 0 0 12px var(--btn-shadow-hover);
}
.btn-row {
  display: flex;
  gap: 8px;
}
.btn-row .btn {
  flex: 1;
}

/* ─── Input ─── */
.input-field {
  width: 100%;
  padding: 12px 14px;
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  color: var(--text-input);
  font-family: inherit;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  min-height: 44px;
  text-align: center;
  letter-spacing: 3px;
  text-transform: uppercase;
}
.input-field:focus {
  border-color: var(--input-focus-border);
  box-shadow: inset 0 0 8px var(--input-focus-shadow);
}
.input-field::placeholder {
  color: var(--text-placeholder);
  letter-spacing: 2px;
}

/* ─── Squad Member List ─── */
.squad-list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.squad-member {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-button);
  border: 1px solid var(--accent-border);
  border-radius: 6px;
  transition: border-color 0.15s;
}
.squad-member:hover {
  border-color: var(--btn-border-hover);
}
.squad-member .member-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}
.squad-member .member-info {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.squad-member .member-name {
  font-size: 12px;
  color: var(--text);
  font-weight: bold;
}
.squad-member .member-role {
  font-size: 9px;
  color: var(--text-muted);
  letter-spacing: 1px;
  text-transform: uppercase;
}
.squad-member .member-status {
  display: flex;
  align-items: center;
  gap: 6px;
}
.squad-member .status-indicator {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.status-online { background: var(--accent); box-shadow: 0 0 4px var(--accent-glow); }
.status-ready { background: var(--accent-bright); box-shadow: 0 0 6px var(--accent-glow); }
.status-away { background: #aa8800; box-shadow: 0 0 4px rgba(170,136,0,0.4); }
.status-empty { background: var(--accent-border); }
.squad-member .ready-toggle {
  font-size: 9px;
  padding: 4px 10px;
  background: var(--bg-input-field);
  border: 1px solid var(--accent-border);
  border-radius: 12px;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.15s;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.squad-member .ready-toggle:hover {
  border-color: var(--btn-border-hover);
  color: var(--text-dim);
}
.squad-member .ready-toggle.active {
  background: var(--bg-button-active);
  border-color: var(--accent);
  color: var(--accent-bright);
  box-shadow: 0 0 6px var(--btn-shadow);
}
.squad-member.empty {
  opacity: 0.5;
}
.squad-member.empty .member-name {
  color: var(--text-muted);
  font-weight: normal;
}

/* ─── Launch Bar ─── */
.launch-bar {
  flex-shrink: 0;
  padding: 12px 14px 16px;
  border-top: 1px solid var(--accent-border);
  position: relative;
  z-index: 5;
  background: var(--bg-dark);
}
.launch-btn {
  width: 100%;
  padding: 15px;
  border: 1px solid var(--accent);
  border-radius: 8px;
  background: var(--bg-button);
  color: var(--accent-bright);
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  letter-spacing: 3px;
  text-transform: uppercase;
  cursor: pointer;
  min-height: 52px;
  transition: all 0.15s;
  box-shadow: 0 0 10px var(--btn-shadow), inset 0 0 8px var(--btn-shadow);
}
.launch-btn:hover {
  background: var(--bg-button-hover);
  border-color: var(--accent-dim);
  box-shadow: 0 0 16px var(--btn-shadow-hover), inset 0 0 12px var(--btn-shadow-hover);
}
.launch-btn:active {
  background: var(--bg-button-active);
  transform: scale(0.98);
}
.launch-btn:disabled {
  opacity: 0.4;
  border-color: var(--accent-border);
  cursor: not-allowed;
  box-shadow: none;
}

/* ─── Divider ─── */
.divider {
  text-align: center;
  font-size: 9px;
  color: var(--text-divider);
  padding: 4px 0;
  letter-spacing: 2px;
  text-transform: uppercase;
}
.divider::before, .divider::after {
  content: '── ';
  color: var(--text-divider-dash);
}
.divider::after { content: ' ──'; }

/* ─── Responsive ─── */
@media (max-height: 640px) {
  .phone { max-height: 100vh; }
  .header { padding: 8px 12px; }
  .content { padding: 10px; gap: 10px; }
  .code-display { padding: 12px 10px; }
  .code-display .code-value { font-size: 22px; }
}
</style>
</head>
<body>

<div class="phone">

  <!-- Effects layers -->
  <div class="scanlines"></div>
  <div class="vignette"></div>
  <div class="freq-wave"></div>

  <!-- ═══ HEADER ═══ -->
  <div class="header">
    <span class="header-icon">📡</span>
    <span class="header-title">GAME LOBBY</span>
    <div class="header-right">
      <div class="theme-switcher">
        <div class="theme-dot theme-dot-green active" data-theme="theme-green" title="Green (Default)"></div>
        <div class="theme-dot theme-dot-cyan" data-theme="theme-cyan" title="Cyan"></div>
        <div class="theme-dot theme-dot-blue" data-theme="theme-lightblue" title="Light Blue"></div>
      </div>
      <div class="signal-bars">
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
        <div class="bar"></div>
      </div>
      <div class="status-dot"></div>
      <span class="header-enc">AES-256</span>
    </div>
  </div>

  <!-- ═══ CONTENT ═══ -->
  <div class="content">

    <!-- Game Code -->
    <div class="code-display">
      <div class="code-label">Squad Access Code</div>
      <div class="code-value" id="gameCode">AB7X-K9M2</div>
      <div class="code-sub">Share this code with your squad</div>
    </div>

    <!-- Create / Join -->
    <div class="btn-row">
      <button class="btn btn-primary" id="btnCreate">Create Game</button>
      <button class="btn" id="btnJoin">Join Game</button>
    </div>

    <div id="joinInputWrap" style="display:none;">
      <input type="text" class="input-field" id="joinInput" placeholder="ENTER CODE" maxlength="10">
    </div>

    <div class="divider">Squad Roster</div>

    <!-- Squad Members -->
    <div class="squad-list" id="squadList">
      <div class="squad-member" data-player="0">
        <div class="member-avatar">👤</div>
        <div class="member-info">
          <div class="member-name">RAVEN-1 (You)</div>
          <div class="member-role">Host · Scout</div>
        </div>
        <div class="member-status">
          <span class="status-indicator status-online"></span>
          <button class="ready-toggle active" data-ready="true">Ready</button>
        </div>
      </div>
      <div class="squad-member" data-player="1">
        <div class="member-avatar">🎖️</div>
        <div class="member-info">
          <div class="member-name">GHOST-2</div>
          <div class="member-role">Medic</div>
        </div>
        <div class="member-status">
          <span class="status-indicator status-ready"></span>
          <button class="ready-toggle active" data-ready="true">Ready</button>
        </div>
      </div>
      <div class="squad-member" data-player="2">
        <div class="member-avatar">🔧</div>
        <div class="member-info">
          <div class="member-name">HAMMER-6</div>
          <div class="member-role">Engineer</div>
        </div>
        <div class="member-status">
          <span class="status-indicator status-away"></span>
          <button class="ready-toggle" data-ready="false">Ready</button>
        </div>
      </div>
      <div class="squad-member empty" data-player="3">
        <div class="member-avatar">○</div>
        <div class="member-info">
          <div class="member-name">Open Slot</div>
          <div class="member-role">Waiting...</div>
        </div>
        <div class="member-status">
          <span class="status-indicator status-empty"></span>
        </div>
      </div>
    </div>

    <div class="divider">Mission Settings</div>

    <div style="font-size:11px;color:var(--text-system);line-height:1.6;">
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--accent-border-light);">
        <span>Mission Type</span>
        <span style="color:var(--text-dim);">Extraction</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--accent-border-light);">
        <span>Duration</span>
        <span style="color:var(--text-dim);">45 min</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--accent-border-light);">
        <span>Difficulty</span>
        <span style="color:var(--text-dim);">Standard</span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:4px 0;">
        <span>Mode</span>
        <span style="color:var(--text-dim);">Co-op Squad</span>
      </div>
    </div>

  </div>

  <!-- ═══ LAUNCH BAR ═══ -->
  <div class="launch-bar">
    <button class="launch-btn" id="btnLaunch" disabled>Waiting for squad...</button>
  </div>

</div>

<script>
(function() {
  const THEME_KEY = 'signal-lost-theme';

  function setTheme(themeName) {
    const phone = document.querySelector('.phone');
    phone.classList.remove('theme-cyan', 'theme-lightblue');
    if (themeName && themeName !== 'theme-green') {
      phone.classList.add(themeName);
    }
    document.querySelectorAll('.theme-dot').forEach(dot => {
      dot.classList.toggle('active', dot.dataset.theme === themeName);
    });
    localStorage.setItem(THEME_KEY, themeName);
  }

  document.addEventListener('DOMContentLoaded', function() {
    const saved = localStorage.getItem(THEME_KEY);
    if (saved) setTheme(saved);
  });

  document.addEventListener('click', function(e) {
    const dot = e.target.closest('.theme-dot');
    if (dot) setTheme(dot.dataset.theme);
  });

  // Game code generation
  function genCode() {
    const p1 = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const p2 = '0123456789';
    return p1[Math.floor(Math.random()*26)] + p1[Math.floor(Math.random()*26)] +
           p2[Math.floor(Math.random()*10)] + p2[Math.floor(Math.random()*10)] + '-' +
           p1[Math.floor(Math.random()*26)] + p1[Math.floor(Math.random()*26)];
  }

  document.getElementById('btnCreate').addEventListener('click', function() {
    document.getElementById('gameCode').textContent = genCode();
    document.getElementById('joinInputWrap').style.display = 'none';
    updateLaunchButton();
  });

  document.getElementById('btnJoin').addEventListener('click', function() {
    const wrap = document.getElementById('joinInputWrap');
    wrap.style.display = wrap.style.display === 'none' ? 'block' : 'none';
    if (wrap.style.display === 'block') {
      document.getElementById('joinInput').focus();
    }
  });

  document.getElementById('joinInput').addEventListener('change', function() {
    const val = this.value.toUpperCase().trim();
    if (val) {
      document.getElementById('gameCode').textContent = val;
      updateLaunchButton();
    }
  });

  // Ready toggles
  document.getElementById('squadList').addEventListener('click', function(e) {
    const toggle = e.target.closest('.ready-toggle');
    if (!toggle) return;
    const isReady = toggle.dataset.ready === 'true';
    toggle.dataset.ready = isReady ? 'false' : 'true';
    toggle.classList.toggle('active', !isReady);
    toggle.textContent = isReady ? 'Ready' : 'Ready';
    // Update status dot
    const member = toggle.closest('.squad-member');
    const dot = member.querySelector('.status-indicator');
    if (!isReady) {
      dot.className = 'status-indicator status-ready';
    } else {
      dot.className = 'status-indicator status-online';
    }
    updateLaunchButton();
  });

  function updateLaunchButton() {
    const toggles = document.querySelectorAll('.squad-member:not(.empty) .ready-toggle');
    const allReady = Array.from(toggles).every(t => t.dataset.ready === 'true');
    const btn = document.getElementById('btnLaunch');
    if (allReady && toggles.length >= 1) {
      btn.disabled = false;
      btn.textContent = 'LAUNCH MISSION';
    } else {
      btn.disabled = true;
      btn.textContent = 'Waiting for squad...';
    }
  }

  updateLaunchButton();
})();
</script>
</body>
</html>
